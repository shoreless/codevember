<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f32">
  <meta name="description" content="Day 01 — Fold. A paper sweet potato unfolds to reveal a golden egg that cracks, unfolds, and hatches two little sweet-potato characters. A Three.js experiment by shoreless.">
  <title>01 · Fold — Codevember</title>
  <link rel="stylesheet" href="style.css?v=4-sea">
</head>
<body>
  <header>
    <a class="back" href="../../" aria-label="All experiments"><span aria-hidden="true">↖</span> Codevember</a>
    <h1><span>01 /</span> Fold</h1>
  </header>
  <main>
    <div id="stage" role="img" aria-label="A flat sheet of plum paper folds into a faceted sweet potato, then unfolds to reveal a golden egg that cracks, unfolds, and hatches two little sweet-potato characters.">
      <p id="fallback" role="status">Preparing the paper…</p>
    </div>
    <section class="transport" aria-label="Animation controls">
      <div class="transport-top">
        <button id="play" type="button" disabled aria-label="Play animation"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg><span id="play-label">Play</span></button>
        <button id="replay" class="replay" type="button" disabled aria-label="Replay animation from the beginning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 1 1 0 6M4 4v5h5"/></svg></button>
        <span class="time"><span id="elapsed">00:00</span><span class="duration"> / 00:36</span></span>
      </div>
      <label class="sr-only" for="timeline">Animation timeline</label>
      <input id="timeline" type="range" min="0" max="36" step="0.01" value="0" disabled aria-valuetext="0 seconds, flat paper">
    </section>
  </main>
  <noscript><p class="no-script">This experiment needs JavaScript to animate the paper.</p></noscript>
  <script type="module">
    import('./scene.js?v=4-sea').catch((error) => {
      console.error(error);
      document.getElementById('fallback').textContent = 'The paper could not load. Try refreshing in a browser with WebGL enabled.';
      document.getElementById('fallback').hidden = false;
    });
  </script>
</body>
</html>
